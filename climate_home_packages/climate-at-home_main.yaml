#===========================================
# Climate At Home - Climate Template
#===========================================

substitutions:
  # Base Device Info
  name: "ClimateAtHome"
  friendly_name: "Climate At Home"
  device_type_suffix: "AC" # e.g. "AC", "HeatPump", "Heater", "Fan", etc.
  room: ""
  device_description: "Climate at Home"
  
  # Project Info
  project_name: "Climate at Home"
  project_version: "v0.2.1"
  
  # Logging
  log_level: "INFO"
  # Adding a fallback status for devices that do not have a dedicated status LED. 
  hardware_status_led: hardware_status_led_fallback
  
  # Add Template Climate Overrides
  ac_platform: "mitsubishi"

  # Climate capabilities
  climate_supports_heat: "false"
  climate_supports_fan_only: "true"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  area: ${room}
  name_add_mac_suffix: true
  min_version: 2026.5.1
  project:
    name: "${project_name}.${hardware_description}"
    version: ${project_version}
  
  # Add grace period for global
  # https://esphome.io/components/esphome/#on_boot
  on_boot:
    - priority: -100 # Run at the end when booting
      then:
        - delay: 15s
        - globals.set:
            id: boot_grace_period
            value: 'false'

ota:
  - platform: esphome
    id: ota_update

logger:
  level: ${log_level}

mdns:
  disabled: false

#===========================================
# Climate Definitions - Base settings.
#===========================================
climate:
  - platform: ${ac_platform}
    id: primary_ac
    transmitter_id: ir_transmitter
    receiver_id: ir_receiver
    name: "${name}-${device_type_suffix}"
    supports_heat: ${climate_supports_heat}
    icon: "mdi:air-conditioner"
    # Set additional conditions for specific modes or switches.
    on_state:
      # Add additional logic for any user based triggers or actions here.
      - if:
          condition:
            lambda: 'return !id(internal_action);'
          then:
            - switch.turn_off: switch_auto_timer
            # We need to cancel Dry Down for manual overrides with AC mode
            - if:
                condition:
                  lambda: 'return id(primary_ac).mode != climate::CLIMATE_MODE_OFF;'
                then:
                  - script.stop: dry_down_sequence
                  - globals.set:
                      id: is_drying_down
                      value: 'false'
                  - globals.set:
                      id: hardware_led_target_state
                      value: '"OFF"'
                  - light.turn_off: ${hardware_status_led}

      # Running Mould Reduction sequence when AC is turned off if the switch is enabled.
      - if:
          condition:
            and:
              - lambda: 'return !id(boot_grace_period);'
              - lambda: 'return id(primary_ac).mode == climate::CLIMATE_MODE_OFF;'
              - lambda: 'return id(switch_anti_mould).state;'
              - lambda: 'return !id(is_drying_down);'
          then:
            - script.execute: dry_down_sequence

      # Add LED Status control based on AC state.
      - if:
          # If the AC is ON and we are NOT running the dry down sequence, set the LED to ON.
          condition:
            and:
              - lambda: 'return id(primary_ac).mode != climate::CLIMATE_MODE_OFF;'
              - lambda: 'return !id(is_drying_down);'
          then:
            - light.turn_on:
                id: ${hardware_status_led}
                effect: "None"
                brightness: 100%
            - globals.set:
                id: hardware_led_target_state
                value: '"ON"'
      
      # If the AC is OFF we turn the LED off.
      - if:
          condition:
            lambda: 'return id(primary_ac).mode == climate::CLIMATE_MODE_OFF;'
          then:
            - globals.set:
                id: hardware_led_target_state
                value: '"OFF"'
            - light.turn_off: ${hardware_status_led}

#===========================================
# Definitions and Sensors
#===========================================

binary_sensor:
  - platform: status
    name: "Status"
    id: system_status
    entity_category: "diagnostic"

#===========================================================
# Switches for feature control and logic.
#===========================================================

switch:
  - platform: template
    name: "Mould Reduction"
    id: switch_anti_mould
    icon: "mdi:weather-windy"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Timer"
    id: switch_auto_timer
    icon: "mdi:timer-outline"
    optimistic: true
    restore_mode: ALWAYS_OFF
    disabled_by_default: true
    turn_on_action:
      - if:
          # If the AC is OFF, run through the ON sequence
          condition:
            lambda: 'return id(primary_ac).mode == climate::CLIMATE_MODE_OFF;'
          then:
            - script.execute: timer_on_sequence
          # If the AC is ON, run through the OFF sequence
          else:
            - script.execute: timer_off_sequence
    turn_off_action:
      # stop both script sequences
      - script.stop: timer_on_sequence
      - script.stop: timer_off_sequence

#===========================================================
# Global Variables and Settings for inbuilt logic.
#===========================================================

globals:
  # we need to add a grace period on boot to prevent false start of triggers
  - id: boot_grace_period
    type: bool
    initial_value: 'true'  # This needs to be true when the device boots   
  # we need to track if this is an internal action or external user action. 
  - id: internal_action
    type: bool
    initial_value: 'false'
  # Mould reduction action flag
  - id: is_drying_down
    type: bool
    initial_value: 'false'

#===========================================================
# Fallback Status LED for hardware without a dedicated LED.
#===========================================================

output:
  - platform: template
    id: hardware_status_led_output
    type: float
    write_action:
      - lambda: |-
          // no-op fallback output

light:
  - platform: monochromatic
    name: "Status LED"
    id: hardware_status_led_fallback
    output: hardware_status_led_output
    internal: true
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Dry Down Status"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 100%

#===========================================================
# Dropdowns for User UI Settings.
#===========================================================

select:
  - platform: template
    name: "Timer ON Mode"
    id: timer_on_mode
    icon: "mdi:air-conditioner"
    entity_category: "config"
    options:
      - "COOL"
      - "HEAT"
      - "FAN_ONLY"
      - "DRY"
      - "AUTO"
    initial_option: "COOL"
    optimistic: true
    restore_value: true

#===========================================================
# Home Assistant Number Sliders for User UI Settings.
#===========================================================

number:
# Mould reduction duration sliders. Duration and delay before being triggered.
  - platform: template
    name: "Mould Reduction Timer"
    id: dry_down_duration
    icon: "mdi:timer-outline"
    entity_category: "config"
    unit_of_measurement: "min"
    min_value: 5
    max_value: 30
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true

  - platform: template
    name: "Mould Reduction Delay"
    id: dry_down_delay
    icon: "mdi:timer-sand"
    entity_category: "config"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 90
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true

  # Single Timer Slider for both ON and OFF options
  - platform: template
    name: "Timer (On⁄Off)"
    id: timer_duration
    icon: "mdi:timer-cog-outline"
    entity_category: "config"
    unit_of_measurement: "min"
    min_value: 10
    max_value: 240
    step: 10
    initial_value: 90
    optimistic: true
    restore_value: true

#===========================================================
# Scripts and Behaviour Logic.
#===========================================================

# Mould Reduction script, to dry out ac unit when turned off.
script:
  - id: dry_down_sequence
    mode: restart
    then:
      - globals.set:
          id: is_drying_down
          value: 'true'
      # User set delay, set by number slider in haos. / Time conversion for seconds to milliseconds for the delay.
      - delay: !lambda 'return id(dry_down_delay).state * 1000;'
      # Check if the AC is still off, if so, switch to fan mode. If not, exit and reset drying down flag.
      - if:
          condition:
            lambda: 'return id(primary_ac).mode == climate::CLIMATE_MODE_OFF;'
          then:
            # Raise our flag, change to FAN, lower flag
            - globals.set:
                id: internal_action
                value: 'true'
            - climate.control:
                id: primary_ac
                mode: "FAN_ONLY"
             # We should buffer for state update between mode changes
            - delay: 500ms
            - globals.set:
                id: internal_action
                value: 'false'
            # Switch the LED to pulse to show we are in dry down.    
            - light.turn_on:
                id: ${hardware_status_led}
                effect: "Dry Down Status"
            - globals.set:
                id: hardware_led_target_state
                value: '"DRY_DOWN"'
            # Time conversion for minutes to milliseconds for the delay.
            - delay: !lambda 'return id(dry_down_duration).state * 60000;'
            
            # Raise our flag, turn OFF, lower flag
            - globals.set:
                id: internal_action
                value: 'true'
            - climate.control:
                id: primary_ac
                mode: "OFF"
            # We should buffer for state update between mode changes
            - delay: 500ms
            - globals.set:
                id: internal_action
                value: 'false'
            # Time to switch the LED back off to show we are done with dry down.
            - globals.set:
                id: hardware_led_target_state
                value: '"OFF"'
            - light.turn_off: ${hardware_status_led}
            # Add a short delay to ensure the device has time to process the OFF before we reset the flag.    
            - delay: 2s
            - globals.set:
                id: is_drying_down
                value: 'false'
          # If the AC is not OFF, we will exit the script and reset the drying down flag.
          else:
            - globals.set:
                id: is_drying_down
                value: 'false'
            # Update LED to reflect current AC state (AC was turned back on during the delay)
            - light.turn_on:
                id: ${hardware_status_led}
                effect: "None"
                brightness: 100%
            - globals.set:
                id: hardware_led_target_state
                value: '"ON"'

  - id: timer_off_sequence
    mode: restart
    then:
      # Using the single slider for delay / Time conversion for minutes to milliseconds for the delay.
      - delay: !lambda 'return id(timer_duration).state * 60000;'
      
      - if:
          condition:
            and:
              - lambda: 'return id(primary_ac).mode != climate::CLIMATE_MODE_OFF;'
              - lambda: 'return !id(is_drying_down);'
          then:
            - globals.set:
                id: internal_action
                value: 'true'
            - climate.control:
                id: primary_ac
                mode: "OFF"
            - delay: 500ms
            - globals.set:
                id: internal_action
                value: 'false'
                
      - switch.turn_off: switch_auto_timer

  - id: timer_on_sequence
    mode: restart
    then:
      # Using the single slider for delay / Time conversion for minutes to milliseconds for the delay.
      - delay: !lambda 'return id(timer_duration).state * 60000;'
      
      - globals.set:
          id: internal_action
          value: 'true'

      # Check the dropdown state and apply the correct mode
      - if:
          condition:
            lambda: 'return id(timer_on_mode).current_option() == "COOL";'
          then:
            - climate.control:
                id: primary_ac
                mode: "COOL"
      - if:
          condition:
            lambda: 'return id(timer_on_mode).current_option() == "HEAT";'
          then:
            - climate.control:
                id: primary_ac
                mode: "HEAT"
      - if:
          condition:
            lambda: 'return id(timer_on_mode).current_option() == "FAN_ONLY";'
          then:
            - climate.control:
                id: primary_ac
                mode: "FAN_ONLY"
      - if:
          condition:
            lambda: 'return id(timer_on_mode).current_option() == "DRY";'
          then:
            - climate.control:
                id: primary_ac
                mode: "DRY"
      - if:
          condition:
            lambda: 'return id(timer_on_mode).current_option() == "AUTO";'
          then:
            - climate.control:
                id: primary_ac
                mode: "AUTO"
      # We should buffer for state update between mode changes
      - delay: 500ms
      - globals.set:
          id: internal_action
          value: 'false'
      - switch.turn_off: switch_auto_timer
