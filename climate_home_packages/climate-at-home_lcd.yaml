#===========================================================
# Climate At Home - Local LVGL climate controller
#===========================================================
# Interface based on Climate Control Display - https://github.com/hareeshmu/climate-control-display
# Required package IDs:
#   primary_ac         - climate-at-home_main.yaml
#   device_display     - hardware display component
#   device_touchscreen - hardware touchscreen component
#   display_backlight  - hardware backlight light component
#
# All reads and writes are local to esphome.
# The HAOS requirement has been removed for simplicity and to act as an ESPHome standalone climate interface.

substitutions:
  # Dial and button behaviour. Override these in the device configuration when
  # the selected climate platform uses different limits or fan mode names.
  lcd_min_temperature: "15"
  lcd_max_temperature: "30"
  # LVGL arc/meter values are integer tenths of a degree. Override these two
  # together with the degree values above.
  lcd_min_temperature_x10: "150"
  lcd_max_temperature_x10: "300"
  lcd_temperature_step: "1"
  lcd_power_on_mode: "COOL"
  lcd_fan_mode_1: "AUTO"
  lcd_fan_mode_2: "LOW"
  lcd_fan_mode_3: "MEDIUM"
  lcd_fan_mode_4: "HIGH"
  lcd_fan_mode_5: "DIFFUSE"

  # Material Design Icons
  mdi_power: "\U000F0425"
  mdi_fire: "\U000F0238"
  mdi_snowflake: "\U000F0717"
  mdi_fan: "\U000F0210"
  mdi_fan_auto: "\U000F171D"
  mdi_fan_speed_1: "\U000F1472"
  mdi_fan_speed_2: "\U000F1473"
  mdi_fan_speed_3: "\U000F1474"
  mdi_thermometer: "\U000F050F"
  mdi_thermostat_auto: "\U000F1B17"
  mdi_chevron_up: "\U000F0143"
  mdi_chevron_down: "\U000F0140"
  mdi_plus: "\U000F0415"
  mdi_minus: "\U000F0374"
  mdi_water_percent: "\U000F058E"

  # Theme
  color_white: "0xFFFFFF"
  color_grey: "0xa5a5a5"
  color_dark_grey: "0x282828"
  color_darker_grey: "0x212121"
  color_light_grey: "0x444444"
  color_accent: "0x18bcf2"
  color_success: "0x7fff00"
  color_auto: "0x2fd1c5"
  color_cool: "0x00bfff"
  color_heat: "0xff1493"
  color_dry: "0xff8c00"
  color_fan: "0x87ceeb"
  color_temp_current: "0x35ffe6"
  color_temp_set: "0x51a0e4"
  color_temp_ticks: "0x585858"

esphome:
  on_boot:
    - priority: -100
      then:
        - delay: 1s
        - script.execute: lcd_apply_capabilities
        - script.execute: lcd_refresh
        - lvgl.widget.hide: boot_screen
        - light.turn_on:
            id: display_backlight
            brightness: !lambda return id(lcd_backlight_brightness).state / 100.0f;

# Add display refresh behaviour without coupling the main climate package to LVGL.
# !extend is used to reference the primary_ac and add the lcd refresh script to the on_state trigger.
climate:
  - id: !extend primary_ac
    on_state:
      - script.execute: lcd_refresh
      - script.execute: lcd_wake

# Add wake handling to the touchscreen defined by the hardware package.
touchscreen:
  on_touch:
    - script.execute: lcd_wake

switch:
  - platform: template
    name: "Touch Diagnostic"
    id: lcd_touch_diagnostic
    icon: mdi:crosshairs-gps
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: lcd_wake
      - lvgl.widget.hide:
          - lcd_touch_crosshair_down
          - lcd_touch_crosshair_up
      - lvgl.widget.show: lcd_touch_diagnostic_overlay
    turn_off_action:
      - lvgl.widget.hide: lcd_touch_diagnostic_overlay

number:
  - platform: template
    name: "Display Brightness"
    id: lcd_backlight_brightness
    icon: mdi:brightness-percent
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    mode: slider
    on_value:
      - if:
          condition:
            lambda: return !id(lcd_is_idle);
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda return x / 100.0f;

  - platform: template
    name: "Display Timeout"
    id: lcd_screen_timeout
    icon: mdi:timer
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 300
    unit_of_measurement: "s"
    min_value: 10
    max_value: 300
    step: 5
    mode: slider

globals:
  - id: lcd_is_idle
    type: bool
    initial_value: "false"

  - id: lcd_fan_modes
    type: std::vector<std::string>
    restore_value: false
    initial_value: '{"${lcd_fan_mode_1}", "${lcd_fan_mode_2}", "${lcd_fan_mode_3}", "${lcd_fan_mode_4}", "${lcd_fan_mode_5}"}'

font:
  - file: "gfonts://Roboto"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–'
    id: lcd_font_regular
    size: 18
    bpp: 4
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_power}
          - ${mdi_fire}
          - ${mdi_snowflake}
          - ${mdi_fan}
          - ${mdi_fan_auto}
          - ${mdi_fan_speed_1}
          - ${mdi_fan_speed_2}
          - ${mdi_fan_speed_3}

  - file: "gfonts://Roboto"
    glyphs: ' 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ°.:/+-%–'
    id: lcd_font_medium
    size: 24
    bpp: 4
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - ${mdi_thermometer}
          - ${mdi_thermostat_auto}
          - ${mdi_chevron_up}
          - ${mdi_chevron_down}
          - ${mdi_plus}
          - ${mdi_minus}
          - ${mdi_water_percent}
          - ${mdi_power}
          - ${mdi_fire}
          - ${mdi_snowflake}
          - ${mdi_fan}
          - ${mdi_fan_auto}
          - ${mdi_fan_speed_1}
          - ${mdi_fan_speed_2}
          - ${mdi_fan_speed_3}

  - file: "gfonts://Roboto"
    glyphs: ' -0123456789.°C'
    id: lcd_font_large
    size: 50
    bpp: 4

script:
  - id: lcd_wake
    mode: restart
    then:
      - globals.set:
          id: lcd_is_idle
          value: "false"
      - script.stop: lcd_idle_screen_off
      - lvgl.resume:
      - light.turn_on:
          id: display_backlight
          brightness: !lambda return id(lcd_backlight_brightness).state / 100.0f;
          transition_length: 1s

  - id: lcd_idle_screen_off
    mode: restart
    then:
      - globals.set:
          id: lcd_is_idle
          value: "true"
      - light.turn_on:
          id: display_backlight
          brightness: 50%
          transition_length: 5s
      - delay: 30s
      - light.turn_on:
          id: display_backlight
          brightness: 35%
          transition_length: 5s
      - delay: 30s
      - light.turn_off: display_backlight
      - lvgl.pause:
          show_snow: true

  - id: lcd_apply_capabilities
    then:
      - if:
          condition:
            lambda: return !${enable_heat};
          then:
            - lvgl.widget.hide: heat_button
      - if:
          condition:
            lambda: return !${enable_fan_only};
          then:
            - lvgl.widget.hide: fan_only_button

  # Synchronize every visible value from the local primary_ac component.
  - id: lcd_refresh
    mode: restart
    then:
      - lambda: |-
          const auto mode = id(primary_ac).mode;
          const bool is_off = mode == climate::CLIMATE_MODE_OFF;

          lv_obj_set_style_text_color(id(auto_button_label), lv_color_hex(${color_grey}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(cool_button_label), lv_color_hex(${color_grey}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(heat_button_label), lv_color_hex(${color_grey}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(dry_button_label), lv_color_hex(${color_grey}), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(fan_only_button_label), lv_color_hex(${color_grey}), LV_PART_MAIN);

          const char *mode_text = "OFF";
          if (mode == climate::CLIMATE_MODE_AUTO) {
            mode_text = "AUTO";
            lv_obj_set_style_text_color(id(auto_button_label), lv_color_hex(${color_auto}), LV_PART_MAIN);
          } else if (mode == climate::CLIMATE_MODE_COOL) {
            mode_text = "COOL";
            lv_obj_set_style_text_color(id(cool_button_label), lv_color_hex(${color_cool}), LV_PART_MAIN);
          } else if (mode == climate::CLIMATE_MODE_HEAT) {
            mode_text = "HEAT";
            lv_obj_set_style_text_color(id(heat_button_label), lv_color_hex(${color_heat}), LV_PART_MAIN);
          } else if (mode == climate::CLIMATE_MODE_DRY) {
            mode_text = "DRY";
            lv_obj_set_style_text_color(id(dry_button_label), lv_color_hex(${color_dry}), LV_PART_MAIN);
          } else if (mode == climate::CLIMATE_MODE_FAN_ONLY) {
            mode_text = "FAN";
            lv_obj_set_style_text_color(id(fan_only_button_label), lv_color_hex(${color_fan}), LV_PART_MAIN);
          }
          lv_label_set_text(id(mode_label), mode_text);
          lv_obj_set_style_text_color(id(power_button_label),
              lv_color_hex(is_off ? ${color_grey} : ${color_success}), LV_PART_MAIN);

          const lv_obj_flag_t hidden = LV_OBJ_FLAG_HIDDEN;
          lv_obj_t *controls[] = {id(temp_inc_button), id(temp_dec_button), id(temp_icon_label),
                                  id(fan_inc_button), id(fan_dec_button), id(fan_speed_roller)->obj,
                                  id(temperature_meter), id(target_temp_knob), id(fan_speed_label)};
          for (auto *control : controls) {
            if (is_off) lv_obj_add_flag(control, hidden);
            else lv_obj_clear_flag(control, hidden);
          }

          if (std::isfinite(id(primary_ac).target_temperature)) {
            const float target = id(primary_ac).target_temperature;
            char target_text[12];
            snprintf(target_text, sizeof(target_text), "%.1f", target);
            lv_label_set_text(id(target_temp_label), target_text);
            lv_arc_set_value(id(target_temp_knob), (int) lroundf(target * 10.0f));
          } else {
            lv_label_set_text(id(target_temp_label), "---");
          }
          lv_obj_set_style_text_color(id(target_temp_label),
              lv_color_hex(is_off ? ${color_grey} : ${color_white}), LV_PART_MAIN);

          if (std::isfinite(id(primary_ac).current_temperature)) {
            char current_text[12];
            snprintf(current_text, sizeof(current_text), "%.1f°C", id(primary_ac).current_temperature);
            lv_label_set_text(id(current_temp_label), current_text);
            id(current_temp_needle)->set_value(
                (int) lroundf(id(primary_ac).current_temperature * 10.0f));
            lv_obj_clear_flag(id(current_temp_label), hidden);
            if (!is_off) lv_obj_clear_flag(id(temperature_meter), hidden);
          } else {
            lv_obj_add_flag(id(current_temp_label), hidden);
            lv_obj_add_flag(id(temperature_meter), hidden);
          }

          std::string fan_text = "${mdi_fan} ---";
          if (id(primary_ac).fan_mode.has_value()) {
            std::string mode_name;
            switch (id(primary_ac).fan_mode.value()) {
              case climate::CLIMATE_FAN_ON: mode_name = "on"; break;
              case climate::CLIMATE_FAN_OFF: mode_name = "off"; break;
              case climate::CLIMATE_FAN_AUTO: mode_name = "auto"; break;
              case climate::CLIMATE_FAN_LOW: mode_name = "low"; break;
              case climate::CLIMATE_FAN_MEDIUM: mode_name = "medium"; break;
              case climate::CLIMATE_FAN_HIGH: mode_name = "high"; break;
              case climate::CLIMATE_FAN_MIDDLE: mode_name = "middle"; break;
              case climate::CLIMATE_FAN_FOCUS: mode_name = "focus"; break;
              case climate::CLIMATE_FAN_DIFFUSE: mode_name = "diffuse"; break;
              case climate::CLIMATE_FAN_QUIET: mode_name = "quiet"; break;
            }
            for (size_t index = 0; index < id(lcd_fan_modes).size(); index++) {
              std::string configured = id(lcd_fan_modes)[index];
              std::transform(configured.begin(), configured.end(), configured.begin(), ::tolower);
              if (configured == mode_name) {
                id(fan_speed_roller)->set_selected_index(index, LV_ANIM_ON);
                break;
              }
            }
            std::transform(mode_name.begin(), mode_name.end(), mode_name.begin(), ::toupper);
            fan_text = "${mdi_fan} " + mode_name;
          }
          lv_label_set_text(id(fan_speed_label), fan_text.c_str());

  - id: lcd_adjust_temperature
    parameters:
      direction: int
    then:
      - climate.control:
          id: primary_ac
          target_temperature: !lambda |-
            float value = id(primary_ac).target_temperature;
            if (!std::isfinite(value)) value = ${lcd_min_temperature};
            value += direction * ${lcd_temperature_step};
            return std::max((float) ${lcd_min_temperature}, std::min((float) ${lcd_max_temperature}, value));

  - id: lcd_cycle_fan_mode
    parameters:
      direction: int
    then:
      - lambda: |-
          int index = (int) id(fan_speed_roller)->get_selected_index();
          index = (index + direction + 5) % 5;
          id(fan_speed_roller)->set_selected_index(index, LV_ANIM_ON);
      - if:
          condition:
            lambda: return id(fan_speed_roller)->get_selected_index() == 0;
          then:
            - climate.control: { id: primary_ac, fan_mode: "${lcd_fan_mode_1}" }
      - if:
          condition:
            lambda: return id(fan_speed_roller)->get_selected_index() == 1;
          then:
            - climate.control: { id: primary_ac, fan_mode: "${lcd_fan_mode_2}" }
      - if:
          condition:
            lambda: return id(fan_speed_roller)->get_selected_index() == 2;
          then:
            - climate.control: { id: primary_ac, fan_mode: "${lcd_fan_mode_3}" }
      - if:
          condition:
            lambda: return id(fan_speed_roller)->get_selected_index() == 3;
          then:
            - climate.control: { id: primary_ac, fan_mode: "${lcd_fan_mode_4}" }
      - if:
          condition:
            lambda: return id(fan_speed_roller)->get_selected_index() == 4;
          then:
            - climate.control: { id: primary_ac, fan_mode: "${lcd_fan_mode_5}" }

lvgl:
  displays: device_display
  touchscreens: device_touchscreen
  rotation: 90
  bg_color: ${color_darker_grey}
  text_color: ${color_white}
  scrollbar_mode: "OFF"
  default_font: lcd_font_regular
  on_idle:
    - timeout: !lambda return id(lcd_screen_timeout).state * 1000;
      then:
        - script.execute: lcd_idle_screen_off

  style_definitions:
    - id: lcd_circle_button
      bg_opa: TRANSP
      radius: 75
      outline_width: 1
      width: 50
      height: 50
    - id: lcd_mode_button
      bg_opa: TRANSP
      radius: 50
      outline_width: 1
      height: 35
      width: 60
      align: BOTTOM_MID
    - id: lcd_button_label
      align: CENTER
      y: 2
      text_align: CENTER
      text_font: lcd_font_medium

  top_layer:
    widgets:
      - obj:
          id: boot_screen
          width: 100%
          height: 100%
          bg_color: ${color_darker_grey}
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - spinner:
                align: CENTER
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: ${color_accent}
                  arc_width: 8
      # Full-screen touch diagnostic overlay. It contains no labels or other widgets for calibration reference.

      - obj:
          id: lcd_touch_diagnostic_overlay
          hidden: true
          align: TOP_LEFT
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          on_press:
            - lambda: |-
                // LVGL event coordinates include its configured display
                // rotation, matching the coordinates used for button hits.
                lv_obj_set_pos(id(lcd_touch_crosshair_down)->obj, point.x - 10, point.y - 10);
                lv_obj_set_pos(id(lcd_touch_crosshair_up)->obj, point.x - 10, point.y - 10);
                lv_obj_clear_flag(id(lcd_touch_crosshair_down)->obj, LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag(id(lcd_touch_crosshair_up)->obj, LV_OBJ_FLAG_HIDDEN);
          on_pressing:
            - lambda: |-
                lv_obj_set_pos(id(lcd_touch_crosshair_down)->obj, point.x - 10, point.y - 10);
                lv_obj_set_pos(id(lcd_touch_crosshair_up)->obj, point.x - 10, point.y - 10);
          widgets:
            - line:
                id: lcd_touch_crosshair_down
                hidden: true
                align: TOP_LEFT
                line_color: ${color_accent}
                line_width: 2
                line_rounded: true
                points:
                  - 0, 0
                  - 20, 20
            - line:
                id: lcd_touch_crosshair_up
                hidden: true
                align: TOP_LEFT
                line_color: ${color_accent}
                line_width: 2
                line_rounded: true
                points:
                  - 20, 0
                  - 0, 20

  pages:
    - id: climate_lcd_page
      widgets:
        - arc:
            height: 250
            width: 250
            y: -20
            align: CENTER
            arc_color: ${color_light_grey}
            arc_width: 10
            arc_rounded: false
            knob:
              bg_color: ${color_white}
        - obj:
            height: 238
            width: 238
            y: -20
            radius: 120
            align: CENTER
            border_width: 40
            border_color: ${color_dark_grey}
            bg_color: ${color_darker_grey}
        - meter:
            id: temperature_meter
            hidden: true
            height: 248
            width: 248
            y: -20
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            scales:
              range_from: ${lcd_min_temperature_x10}
              range_to: ${lcd_max_temperature_x10}
              ticks:
                count: 60
                length: 18
                width: 2
                color: ${color_temp_ticks}
              indicators:
                - line:
                    id: current_temp_needle
                    color: ${color_temp_current}
                    width: 3
                    length: 10
                    value: ${lcd_min_temperature_x10}
        - obj:
            height: 180
            width: 180
            y: -20
            radius: 120
            align: CENTER
            border_width: 12
            border_color: ${color_dark_grey}
            bg_color: ${color_darker_grey}
        - arc:
            id: target_temp_knob
            hidden: true
            align: CENTER
            arc_opa: TRANSP
            adjustable: true
            value: 240
            min_value: ${lcd_min_temperature_x10}
            max_value: ${lcd_max_temperature_x10}
            width: 215
            height: 215
            y: -20
            arc_width: 16
            change_rate: 30
            indicator:
              arc_opa: TRANSP
            knob:
              bg_color: ${color_temp_set}
              border_width: 4
              border_color: ${color_white}
            on_release:
              - climate.control:
                  id: primary_ac
                  target_temperature: !lambda |-
                    float value = x / 10.0f;
                    float step = ${lcd_temperature_step};
                    return roundf(value / step) * step;
        - label:
            id: mode_label
            align: CENTER
            y: -70
            text: "OFF"
            text_color: ${color_grey}
        - label:
            id: target_temp_label
            align: CENTER
            y: -20
            text_font: lcd_font_large
            text: "---"
        - label:
            align: CENTER
            x: 60
            y: -35
            text: "°C"
        - label:
            id: current_temp_label
            hidden: true
            align: CENTER
            y: 30
            text: "---"
            text_color: ${color_temp_current}
        - label:
            id: fan_speed_label
            hidden: true
            align: CENTER
            y: 78
            text: "---"
            text_color: ${color_grey}
        - button:
            id: temp_inc_button
            hidden: true
            x: 30
            y: -70
            align: LEFT_MID
            styles: lcd_circle_button
            widgets:
              - label: { styles: lcd_button_label, text: "${mdi_plus}" }
            on_press:
              - script.execute: { id: lcd_adjust_temperature, direction: 1 }
        - label:
            id: temp_icon_label
            hidden: true
            align: LEFT_MID
            x: 42
            y: -15
            text: ${mdi_thermometer}
            text_font: lcd_font_medium
        - button:
            id: temp_dec_button
            hidden: true
            x: 30
            y: 30
            align: LEFT_MID
            styles: lcd_circle_button
            widgets:
              - label: { styles: lcd_button_label, text: "${mdi_minus}" }
            on_press:
              - script.execute: { id: lcd_adjust_temperature, direction: -1 }
        - button:
            id: fan_inc_button
            hidden: true
            x: -30
            y: -70
            align: RIGHT_MID
            styles: lcd_circle_button
            widgets:
              - label: { styles: lcd_button_label, text: "${mdi_chevron_up}" }
            on_press:
              - script.execute: { id: lcd_cycle_fan_mode, direction: 1 }
        - roller:
            id: fan_speed_roller
            hidden: true
            state:
              disabled: true
            align: RIGHT_MID
            x: -27
            y: -15
            anim_duration: 500ms
            text_font: lcd_font_medium
            text_opa: TRANSP
            bg_opa: TRANSP
            border_width: 0
            visible_row_count: 2
            selected:
              text_font: lcd_font_medium
              text_opa: COVER
              bg_opa: TRANSP
            options:
              - ${mdi_fan_auto}
              - ${mdi_fan_speed_1}
              - ${mdi_fan_speed_2}
              - ${mdi_fan_speed_3}
              - ${mdi_fan}
        - button:
            id: fan_dec_button
            hidden: true
            x: -30
            y: 30
            align: RIGHT_MID
            styles: lcd_circle_button
            widgets:
              - label: { styles: lcd_button_label, text: "${mdi_chevron_down}" }
            on_press:
              - script.execute: { id: lcd_cycle_fan_mode, direction: -1 }

        # Mode buttons are positioned along the bottom edge.
        - button:
            id: power_button
            x: -180
            y: -15
            styles: lcd_mode_button
            widgets:
              - label:
                  id: power_button_label
                  styles: lcd_button_label
                  text: ${mdi_power}
                  text_color: ${color_grey}
            on_press:
              - if:
                  condition:
                    lambda: return id(primary_ac).mode == climate::CLIMATE_MODE_OFF;
                  then:
                    - climate.control: { id: primary_ac, mode: "${lcd_power_on_mode}" }
                  else:
