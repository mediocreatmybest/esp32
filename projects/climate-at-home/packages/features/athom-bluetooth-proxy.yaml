# Adding in package file for Bluetooth proxy support for Athom RF IR Remote. This is WIP.
# https://github.com/athom-tech/esp32-configs/blob/main/athom-rf-ir-remote.yaml
#
# Package path:
# projects/climate-at-home/packages/features/athom-bluetooth-proxy.yaml

# Bluetooth Proxy esp32 framework settings for Athom RF IR Remote. This is WIP.
esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      # For BLE Proxy
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y

# API BLUETOOTH PROXY Settings based on the original Athom RF IR Remote package.
api:
  # Optional BLE tracker from Athom-rf-ir yaml.
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms # default 320ms - how long to spend on each advert channel
    window: 300ms # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

# Bluetooth Proxy settings.
bluetooth_proxy:
  active: true
  cache_services: true
  # 3 seems to be reasonable, but can be adjusted if needed.
  connection_slots: 3
