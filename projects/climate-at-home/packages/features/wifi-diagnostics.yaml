#===========================================
# Climate At Home - Wi-Fi Diagnostics
#===========================================
#
# Package path:
# projects/climate-at-home/packages/features/wifi-diagnostics.yaml

#===========================================
# Definitions and Sensors
#===========================================

sensor:
  - platform: wifi_signal
    name: 'WiFi Signal dB'
    id: wifi_signal_db
    update_interval: 60s
    disabled_by_default: true
    entity_category: diagnostic
    icon: 'mdi:wifi-strength-1'

  # Simplistic Percentage conversion, TODO: should be looked at in future.
  - platform: copy
    source_id: wifi_signal_db
    name: 'WiFi Signal Percent'
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: '%'
    entity_category: diagnostic
    icon: 'mdi:wifi-strength-1'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: 'IP Address'
      id: ip_address
      entity_category: diagnostic
    ssid:
      name: 'Connected SSID'
      id: ssid
      entity_category: diagnostic
    mac_address:
      name: 'Mac Address'
      id: mac_address
      entity_category: diagnostic
      icon: 'mdi:check-network'
