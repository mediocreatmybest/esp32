lvgl:
  # This should help fix the page transition stuttering on slower hardware.
  # We just need to keep track of any upstream project changes.
  pages:
    # Opening the climate controls.
    - id: !extend main_page
      widgets:
        - container:
            id: !extend livingroom_remote_ac_tile
            widgets:
              - button:
                  id: !extend button_livingroom_remote_ac
                  on_short_click:
                    then:
                      - lvgl.page.show:
                          id: !extend livingroom_remote_ac_climate_page
                          animation: NONE
                          time: 0ms

    # Returning to the main page.
    - id: !extend livingroom_remote_ac_climate_page
      widgets:
        - button:
            id: !extend livingroom_remote_ac_back_corner_btn
            on_click:
              - lvgl.page.show:
                  id: !extend main_page
                  animation: NONE
                  time: 0ms
