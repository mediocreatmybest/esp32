name: ESPHome CI

on:
  # Test any changes before they are merged into main.
  pull_request:
    branches:
      - main

  # Test result after changes are merged into main.
  push:
    branches:
      - main

  # Let's allow the workflow to be run manually from GitHub Actions.
  workflow_dispatch:

# Only read access is needed at this stage.
permissions:
  contents: read

# Cancel older runs when another commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  builds:
    name: ESPHome Builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose and show ESPHome image
        run: |
          docker compose config --quiet
          docker compose config --images
      - name: Compile canonical and legacy compositions
        run: |
          for file in \
            projects/climate-at-home/tests/local/athom-mitsubishi.yaml \
            projects/climate-at-home/tests/local/athom-mitsubishi-ble.yaml \
            projects/climate-at-home/tests/local/waveshare-touch-remote-mitsubishi.yaml \
            projects/climate-at-home/tests/compatibility/athom-mitsubishi.yaml \
            projects/climate-at-home/tests/compatibility/waveshare-touch-remote-mitsubishi.yaml
          do
            echo "::group::Compiling $file"
            if ! docker compose run --rm --no-deps -T esphome compile "$file"; then
              echo "::error file=$file::ESPHome compilation failed"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done

  validation:
    name: ESPHome Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose and show ESPHome image
        run: |
          docker compose config --quiet
          docker compose config --images
          # Keep the resolved-config directory writable by the runner.
          mkdir -p .esphome
      - name: Validate independent layers and legacy BLE composition
        run: |
          for file in \
            projects/climate-at-home/tests/local/athom-mitsubishi-core.yaml \
            projects/climate-at-home/tests/local/athom-mitsubishi-core-fallback.yaml \
            projects/climate-at-home/tests/local/athom-mitsubishi-timer.yaml \
            projects/climate-at-home/tests/local/athom-mitsubishi-anti-mould.yaml \
            projects/climate-at-home/tests/compatibility/athom-mitsubishi-ble.yaml
          do
            echo "::group::Validating $file"
            if ! docker compose run --rm --no-deps -T esphome config "$file"; then
              echo "::error file=$file::ESPHome configuration validation failed"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done
      # Validate the defaults manifest and retain its resolved identity for checking.
      - name: Resolve legacy hardware defaults
        run: |
          mkdir -p .esphome
          docker compose run --rm --no-deps -T esphome config \
            projects/climate-at-home/tests/compatibility/waveshare-hardware-defaults.yaml \
            > .esphome/waveshare-hardware-defaults-resolved.yaml
      - name: Verify legacy identity contract
        run: |
          docker compose run --rm --no-deps -T --entrypoint python3 esphome - <<'PY'
          from pathlib import Path
          import re
          import sys
          import yaml

          # BaseLoader handles ESPHome tags and reads all scalar values as strings.
          output = Path(".esphome/waveshare-hardware-defaults-resolved.yaml").read_text()
          output = re.sub(r"\x1b\[[0-9;]*m", "", output)
          resolved = yaml.load(output, Loader=yaml.BaseLoader)["esphome"]
          expected = {
              "name": "waveshare-esp32-s3-touch-35",
              "friendly_name": "WaveShare ESP32-S3 Touch LCD 3.5",
              "name_add_mac_suffix": "false",
          }
          failed = False
          for key, value in expected.items():
              actual = resolved.get(key)
              if actual != value:
                  print(f"Legacy Waveshare {key}: expected {value!r}, got {actual!r}")
                  failed = True
          if failed:
              sys.exit(1)
          print("Legacy Waveshare identity contract passed.")
          PY

  required:
    name: ESPHome CI required
    needs:
      - builds
      - validation

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Confirm ESPHome builds and validation passed
        run: |
          if [ "${{ needs.builds.result }}" != "success" ]; then
            echo "ESPHome builds did not succeed."
            exit 1
          fi

          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "ESPHome validation did not succeed."
            exit 1
          fi

          echo "ESPHome builds and validation passed."
