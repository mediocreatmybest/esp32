# https://github.com/esphome/workflows/blob/main/.github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Schedule updates weekly.
    schedule:
      interval: "weekly"
    # Limit the number of open pull requests to 2.
    open-pull-requests-limit: 2
    # Set prefix for any commit messages created by Dependabot to "ci".
    commit-message:
      prefix: "ci"

  # Check the pinned ESPHome image used by the local Compose environment.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
